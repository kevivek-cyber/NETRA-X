[package]
name = "netra-x-desktop"
version = "0.1.0"
description = "NETRA-X — local-first desktop shell"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "1", features = ["shell-open"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "netra-x-desktop"
path = "src/main.rs"
