[package]
name = "netra-x-desktop"
version = "0.2.2"
description = "NETRA-X — local-first desktop shell"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "1", features = ["shell-open"] }
# Blocking HTTP for the /health probe at startup. Blocking on purpose:
# this runs once before any window opens, so an async runtime would be
# machinery for nothing. TLS is kept so an https tunnel address works
# later without a code change.
ureq = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "netra-x-desktop"
path = "src/main.rs"
